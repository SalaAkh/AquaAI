name: AquaAI Production Uptime

# Monitors an already-deployed site; does not keep a local machine or server alive.
# Set the repository ACTIONS variable AQUA_PRODUCTION_URL after the first Vercel deployment.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  availability:
    if: ${{ vars.AQUA_PRODUCTION_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify production homepage and API
        env:
          BASE_URL: ${{ vars.AQUA_PRODUCTION_URL }}
        shell: bash
        run: |
          set -euo pipefail
          case "$BASE_URL" in
            https://*) ;;
            *) echo "AQUA_PRODUCTION_URL must begin with https://" >&2; exit 1 ;;
          esac
          BASE_URL="${BASE_URL%/}"

          echo "Checking /api/health"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 4 \
            "$BASE_URL/api/health" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                try {
                  const body = JSON.parse(input);
                  if (body.status !== "ok" || body.service !== "aqua-ai") process.exit(1);
                  process.stdout.write("AquaAI health endpoint is responding.\\n");
                } catch (e) {
                  process.stderr.write("Unexpected health JSON.\\n");
                  process.exit(1);
                }
              });
            '

          echo "Checking homepage"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 4 \
            "$BASE_URL/" --output /dev/null

          echo "Production homepage and health endpoint are reachable."
