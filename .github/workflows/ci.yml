name: AquaAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: aqua-app/package-lock.json

      - name: Install dependencies
        working-directory: ./aqua-app
        run: npm ci

      - name: Run Agricultural Hydrology Tests
        working-directory: ./aqua-app
        run: npm test

      - name: Build Next.js Application
        working-directory: ./aqua-app
        run: npm run build
